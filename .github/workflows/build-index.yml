name: Build mod index

# Rebuilds the installable mod zips + index.json whenever a mod changes,
# commits the refreshed site/ (so the raw-fallback feed stays current), and
# deploys the feed to GitHub Pages.
#
# One-time setup by the repo owner: Settings > Pages > Source: GitHub Actions.
# Until that is on, the index still works via the engine's raw fallback:
#   https://raw.githubusercontent.com/chrispanella/gen1recomp-mods/main/site/data/index.json

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - '**.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mod-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build index + zips
        env:
          BUILD_STAMP: ${{ github.sha }}
        run: python tools/build_index.py
      # NOTE: we deliberately do NOT commit site/ back here. The committed
      # site/ (which the raw-fallback feed reads) is rebuilt locally via
      # tools/build_index.py alongside each mod change; letting CI also commit
      # it just creates conflicting bot commits. CI only builds + deploys Pages.
      # Try to enable Pages automatically. If the token can't (org policy,
      # etc.), don't fail the run -- the index still works via the raw
      # fallback the engine uses, so Pages is pure polish.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Never red-X the whole workflow just because Pages isn't enabled yet;
    # the raw-fallback feed keeps the index working regardless.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
