name: Release mods

# Monorepo release workflow. Each top-level folder with a manifest.json is a
# mod. When a mod's manifest "version" has no matching tag yet, this cuts a
# GitHub Release "<id>-v<version>" with an installable "<id>-<version>.zip"
# (every mod file at the archive root, manifest.json included) plus a checksum.
# That is the shape the game accepts on MODS > Import mod .zip, so each release
# asset installs by hand exactly like the other community mods.
#
# Normal flow: bump a mod's manifest version, push to main -> that mod releases.
# The very first run seeds a release for every mod at its current version.
# Manual runs (workflow_dispatch) release whatever is currently untagged.

on:
  push:
    branches: [main]
    paths:
      - '*/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mods
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      any: ${{ steps.scan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find mods whose version has no tag yet
        id: scan
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess

          SEMVER = re.compile(r"^\d+\.\d+\.\d+$")

          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout

          tags = set(t for t in sh("git", "tag", "-l").split() if t)

          mods = []
          for d in sorted(os.listdir(".")):
              mf = os.path.join(d, "manifest.json")
              if not os.path.isfile(mf):
                  continue
              with open(mf, encoding="utf-8") as fh:
                  m = json.load(fh)
              mid = str(m.get("id", d))
              ver = str(m.get("version", ""))
              if not SEMVER.match(ver):
                  continue
              tag = f"{mid}-v{ver}"
              if tag not in tags:
                  mods.append({
                      "dir": d, "id": mid, "version": ver,
                      "name": str(m.get("name", mid)), "tag": tag,
                  })

          print("matrix=" + json.dumps({"include": mods}))
          print("any=" + ("true" if mods else "false"))
          for x in mods:
              print(f"::notice::will release {x['tag']}")
          PY

  release:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if the tag was created since discover ran
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
             || gh release view "$TAG" >/dev/null 2>&1; then
            echo "already released, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the mod .zip
        if: steps.guard.outputs.skip == 'false'
        env:
          DIR: ${{ matrix.dir }}
          MOD_ID: ${{ matrix.id }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$out"; mkdir -p "$out"

          # archive the mod folder's contents at the zip root (manifest at root)
          zip_path="$out/${MOD_ID}-${VERSION}.zip"
          git archive "HEAD:${DIR}" --format=zip -o "$zip_path"

          echo "Archive contents:"
          unzip -l "$zip_path"

          # sanity: manifest.json must sit at the archive root and match
          unzip -p "$zip_path" manifest.json > "$RUNNER_TEMP/m.json"
          python3 - "$RUNNER_TEMP/m.json" "$VERSION" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2]
          got = json.load(open(path, encoding="utf-8")).get("version")
          if got != expected:
              raise SystemExit(f"::error::packed manifest says {got}, expected {expected}")
          print(f"manifest.json at root, version {got}")
          PY

          (cd "$out" && sha256sum "${MOD_ID}-${VERSION}.zip" > "${MOD_ID}-${VERSION}.sha256")
          cat "$out/${MOD_ID}-${VERSION}.sha256"

      - name: Publish GitHub Release
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_ID: ${{ matrix.id }}
          MOD_NAME: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          notes=$'Download **'"${MOD_ID}-${VERSION}.zip"$'** and install it in-game:\nMODS > Import mod .zip.'
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$MOD_NAME $VERSION" \
            --notes "$notes" \
            "dist/${MOD_ID}-${VERSION}.zip" \
            "dist/${MOD_ID}-${VERSION}.sha256"
          echo "Published $TAG"
